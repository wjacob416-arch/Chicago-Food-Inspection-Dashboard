<!DOCTYPE html>
<html>
<head>
    <title>Chicago Food Inspection</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; color: #333; }

        nav {
            background: #1a1a2e;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        nav h1 { color: white; font-size: 20px; }
        nav a { color: #ccc; text-decoration: none; margin-left: 20px; font-size: 15px; }
        nav a:hover { color: white; }

        .hero {
            background: #16213e;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }
        .hero h2 { font-size: 32px; margin-bottom: 10px; }
        .hero p { color: #aaa; margin-bottom: 30px; }

        .search-form {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .search-form input {
            padding: 12px 16px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            width: 260px;
        }
        .search-form button {
            padding: 12px 24px;
            font-size: 15px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .search-form button:hover { background: #c73652; }
    </style>
</head>
<body>
    <nav>
        <h1>Chicago Food Inspection</h1>
        <div>
            <a href="/">Home</a>
            <a href="#about">About</a>
        </div>
    </nav>

    <div class="hero">
        <h2>Search Food Establishments</h2>
        <p>Find inspection results for restaurants across Chicago</p>
        <form class="search-form" action="/search" method="get">
            <input type="text" name="q" placeholder="Search by name or neighborhood">
            <input type="text" name="zip" placeholder="ZIP code">
            <button type="submit">Search</button>
        </form>
    </div>
</body>
</html>
