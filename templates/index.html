<!DOCTYPE html>
<html>
<head>
    <title>Chicago Food Inspection</title>
    <style>
        .topnav {
            overflow: hidden;
            background-color: #e9e9e9;
        }
        .topnav a {
            float: left;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }
        .topnav form {
            float: right;
            display: flex;
            margin: 6px 16px;
        }
        .topnav input[type=text] {
            padding: 6px;
            font-size: 17px;
        }
        @media screen and (max-width: 600px) {
            .topnav a, .topnav form {
                float: none;
                display: block;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="topnav">
        <a class="active" href="/">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <form action="/search" method="get">
            <input type="text" name="q" placeholder="Search by name or neighborhood">
            <input type="text" name="zip" placeholder="ZIP code">
            <button type="submit">Search</button>
        </form>
    </div>
</body>
</html>
